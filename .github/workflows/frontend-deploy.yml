name: Frontend Pipeline

on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'frontend/**' ]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: NPM Install
        working-directory: ./frontend
        run: npm ci

      - name: Test
        working-directory: ./frontend
        run: |
          npm run lint
          npm test

  # Deploy: handled by Vercel's native GitHub integration (no GHA step required).
  # If switching to a Vercel deploy hook, add a deploy job here that calls
  # curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }} on push to main.
